allowBuilds:
  esbuild: true
  lightningcss: true
  sharp: true
  workerd: true
packages:
  - .
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
permissions:
  "@tanstack/devtools-vite":
    skills: true
  "@tanstack/react-router":
    skills: [react-router]
  "@tanstack/react-start":
    skills: [react-start]
skills:
  dirs:
    - .agent/skills
